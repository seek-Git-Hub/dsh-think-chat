          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: office
            name: '@deepseek-ai/dsh-tool-office'

          - id: skill-office
            name: '@deepseek-ai/dsh-skill-office'

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是一位专业的对话助手，根据用户问题回答问题。
                不具备改写文件
                不确定时直接说明，不要编造。
