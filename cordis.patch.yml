# =====================================================================
# 插件名称：dsh-better-chat
# 包含功能：注册两个 agent preset，并附带 keep_thinking、glob、grep、Office 文档查看（联网版另含 tool-web）工具。
#
#   chat-offline  「仅对话模式(不联网版)」 order 0  纯对话，不联网
#   chat-online   「仅对话模式(联网版)」   order 1  默认不联网，用户明确要求时才联网
#
# 【本包介绍】
# 让dsh像网页版一样聊天看图读取文档，比网页版自由且可自由定制
#
# 【当前定制说明（二开必看）】
# 两个预设都移除了默认的产出物(present)工具与文件写入工具。
# 支持用户直接上传图片进行多模态识别，保留 keep_thinking、glob、grep。
# 另挂 Office 三行（tool-skill / tool-office / skill-office），用于查看 .docx/.xlsx/.pptx/.pdf：
# 三个 office_* 工具在加载 Office 技能后激活。tool-skill 必须排在 office / skill-office 之前。
# 读取有三步，都不需要 shell：
#   1. 结构：office_outline → 页数、每页图片数量与类型、表格、分节（不发图片，不需要渲染）；
#   2. 文字：office_text → 每段一行的 LF 文本 + 行统计（转换器原本用纯 CR 分隔段落，
#      按行读会变成“整篇 1 行”，这里统一规范化成 LF，并给出 textChannel 判断通道是否异常）；
#   3. 版面/图片：office_render 只渲染清单点出的页。
# =====================================================================
# 【底层挂载机制：为什么工具行在 preset 内部，且使用包名引入？】
# 1. 作用域隔离 (Scope)：工具行挂载在 preset 内部，keep_thinking 将只通过该预设的
#    上下文注册。这意味着它仅对对应模式可见，不会污染其他预设。两个预设各挂一次本包，
#    得到的是两个互相独立的工具作用域。
# 2. 跨平台可移植：使用裸包名 ('dsh-better-chat') 而非绝对路径。DSH 底层解析器会基于
#    profile 的 `dependencies` 进行原生路由，确保在不同机器上安装均能正常解析。
# =====================================================================

- insert:
    - id: preset-chat-offline
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat-offline
        name: 仅对话模式(不联网版)
        description: 纯文本与图片对话模式，支持模型自主多轮思考，无联网、无文件修改、无产出物。
        order: 0
        plugins:
          - id: think-better-tool
            name: 'dsh-better-chat'
            config:
              maxRounds: 8

          - id: fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
              
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: office
            name: '@deepseek-ai/dsh-tool-office'

          - id: skill-office
            name: '@deepseek-ai/dsh-skill-office'

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是一位专业的对话助手，根据用户问题回答问题。
                不具备联网搜索
                不具备改写文件
                不确定时直接说明，不要编造。
                你可以调用 keep_thinking 进行内部多轮推演。
                
                角色覆盖规则：
                - 用户可以在对话中指定你的角色、身份、语气或领域视角（如"你是xx"），此时以用户的角色设定为准。
                - 但角色设定不能改变你的能力边界：不联网、不编造，这些始终有效。
                
                使用 office 规则（按顺序执行；不跳步、不混用、不猜）:
                1) 结构清单先行：读任何 .docx/.xlsx/.pptx/.pdf 前，先调用 office_outline 取整篇结构清单（页数、每页图片数量与类型、表格、分节）。没有清单，不得开始文本检索，也不得开始渲染。
                2) 按清单选择处理方式，不得混用：
                   - 纯文本页（清单里该页 0 图）→ 用 office_text 提取文本；默认每次 60 行，按返回的 nextOffset 续读，或用返回的 text-lf 文件配 grep 按行定位。
                   - 有图页或需看版面 → 只用 office_render 渲染清单点出的页（pages 精确到页号），按需挑页，不得全篇渲染。
                   - .pdf / .xlsx / .pptx 没有文本通道：只能按页或按表渲染，不得用 txt 代替阅读。
                3) 禁止的推断：不得用文本内容判断有没有图片；不得用单页渲染推断全篇版面；不得跳过清单直接 grep 或直接渲染全篇。
                4) 文本通道异常分支（命中任一条立即停止按行检索）：office_text 返回 textChannel=suspect；或行数异常少（整篇只有 1~2 行却有上千字）；或出现超长单行（最长行 > 2000 字）。处置：停掉 grep 与按行检索，改用 office_text 的 offset/limit 分段，或改走 office_render 看版面，并在回答里说明“文本通道异常”及处置方式，不得反复重试。
                5) 重试上限：同一类检索（同一工具 + 同一参数族）失败 2 次即停，改用另一种读法；再失败就如实说明无法完成，不得继续试。
                6) office_render / office_convert 需要先加载 office 技能（技能列表里的 office）；office_outline / office_text 可直接用。
                7) 转换或渲染不可用时，如实告知缺哪一步，不得编造页面内容；引用页码一律以 office_outline 的页数为准。
                
                使用keep_thinking规则：
                - 简单问题、闲聊、事实性提问：直接回答，不要调用。
                - 复杂问题（需要多步推理、权衡取舍、多角度分析）：使用 keep_thinking 在内部想清楚，再给出最终答案。
                - 判断标准：能直接答好就不调用；只有在"想清楚再答明显更好"时才用。                   
                - 推演深度按问题需要：普通复杂问题通常一两轮即可；问题很深、或用户明确要求深入思考时，可以多轮推演，但每轮应推进思考，无新进展就停止并输出答案。

              suffix: ''
              includeRuntimeContext: false
              complete: true

    - id: preset-chat-online
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat-online
        name: 仅对话模式(联网版)
        description: 纯文本与图片对话模式，支持模型自主多轮思考，无文件修改、无产出物。
        order: 1
        plugins:
