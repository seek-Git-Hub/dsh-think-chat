                   - .pdf / .xlsx / .pptx 没有文本通道：只能按页或按表渲染，不得用 txt 代替阅读。
                3) 禁止的推断：不得用文本内容判断有没有图片；不得用单页渲染推断全篇版面；不得跳过清单直接 grep 或直接渲染全篇。
